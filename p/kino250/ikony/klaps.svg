<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="tlo" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#2a2333"/>
      <stop offset="0.6" stop-color="#141119"/>
      <stop offset="1" stop-color="#0b0a0f"/>
    </radialGradient>
    <linearGradient id="cialo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26222e"/>
      <stop offset="1" stop-color="#1a1720"/>
    </linearGradient>
    <linearGradient id="zloto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f0a52a"/>
    </linearGradient>
    <clipPath id="pasek"><rect x="0" y="0" width="272" height="44" rx="8"/></clipPath>
    <g id="paski">
      <rect x="0" y="0" width="272" height="44" rx="8" fill="#f5ecd9"/>
      <g clip-path="url(#pasek)" fill="#15131a">
        <polygon points="18,0 52,0 30,44 -4,44"/>
        <polygon points="86,0 120,0 98,44 64,44"/>
        <polygon points="154,0 188,0 166,44 132,44"/>
        <polygon points="222,0 256,0 234,44 200,44"/>
      </g>
    </g>
  </defs>
  <rect id="podklad" width="512" height="512" rx="112" fill="url(#tlo)"/>
  <g id="klaps">
    <!-- korpus -->
    <rect x="120" y="236" width="272" height="160" rx="22" fill="url(#cialo)" stroke="url(#zloto)" stroke-width="8"/>
    <rect x="150" y="272" width="120" height="12" rx="6" fill="#f5ecd9" opacity=".85"/>
    <rect x="150" y="300" width="82" height="12" rx="6" fill="#f5ecd9" opacity=".5"/>
    <rect x="150" y="328" width="104" height="12" rx="6" fill="#f5ecd9" opacity=".5"/>
    <path d="M330 296 l9.4 19 21 3 -15.2 14.8 3.6 20.9 -18.8 -9.9 -18.8 9.9 3.6 -20.9 -15.2 -14.8 21 -3z" fill="url(#zloto)"/>
    <!-- dolna listwa -->
    <use href="#paski" x="120" y="196"/>
    <!-- gorna listwa (otwarta) -->
    <g transform="rotate(-17 124 192)">
      <use href="#paski" x="120" y="146"/>
    </g>
    <circle cx="128" cy="194" r="10" fill="url(#zloto)"/>
  </g>
