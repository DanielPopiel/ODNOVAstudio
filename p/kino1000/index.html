<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movies</title>
<meta name="robots" content="noindex">
<script>
  // Kino 1000 to teraz Movies – przenosimy pod nowy adres (z kodem wspólnej listy, jeśli był w linku).
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((r) => r.forEach((x) => { if (x.scope.endsWith('/kino1000/')) x.unregister(); })).catch(() => {});
  location.replace('../movies/' + location.hash);
</script>

</head>
<body><p>Kino 1000 to teraz <a href="../movies/">Movies</a>.</p></body>
</html>
