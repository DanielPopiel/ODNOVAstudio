<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captain Said No – authorization</title><style>body{font-family:system-ui,Segoe UI,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.6;color:#14233f}code{word-break:break-all;background:#f1f3f7;padding:2px 6px;border-radius:4px}</style></head><body><h1>Authorization</h1><p id="m">Waiting for authorization data…</p><script>var p=new URLSearchParams(location.search),c=p.get("code"),e=p.get("error"),m=document.getElementById("m");if(c){m.innerHTML="Authorization code (copy it into the publishing tool):<br><br><code></code>";m.querySelector("code").textContent=c}else if(e){m.textContent="Authorization failed: "+e}else{m.textContent="No authorization data in this URL."}</script></body></html>
